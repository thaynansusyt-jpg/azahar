name: Azahar Lite Android
on:
  push:
    branches: [master]
    paths: [.github/workflows/azahar-lite-build.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lite-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Apply Azahar Lite changes
        shell: bash
        run: |
          base64 --decode <<'LITE_PATCH' > /tmp/azahar-lite.patch
          
